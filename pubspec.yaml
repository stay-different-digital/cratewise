name: cratewise
description: "A Flutter app for vinyl collectors and DJs."
publish_to: 'none'
version: 1.3.0+12

environment:
  sdk: ^3.12.0

dependencies:
  csv: ^8.0.0
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.3.3
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  go_router: ^18.1.4
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  intl: ^0.20.2
  sensors_plus: ^7.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FA003F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Splash: brand colour in both light and dark mode (deliberate choice — the
# brand red matches the adaptive icon background and reads well in both modes).
flutter_native_splash:
  color: "#FA003F"
  color_dark: "#FA003F"
  image: assets/icon/app_icon_foreground.png
  android: true
  ios: true
  android_12:
    color: "#FA003F"
    color_dark: "#FA003F"
    image: assets/icon/app_icon_foreground.png