name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["site/**", "CHANGELOG.md", "README.md", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: site
        run: npm ci || npm install
      - name: Build site
        working-directory: site
        # Project site is served from https://<owner>.github.io/Crate/
        run: npx @11ty/eleventy --pathprefix=/Crate/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
