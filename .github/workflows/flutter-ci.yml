name: Flutter CI

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop

jobs:
  android:
    name: Android analyze, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Android Gradle Plugin 9.3 (Flutter 3.50 template) runs lint with
      # Java 21 APIs; the app itself still targets Java 17.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed with; bump together
          # with local Flutter (unpinned 'stable' moving ahead broke CI once).
          flutter-version: 3.50.0
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      # Release build runs Android lint (lintVitalRelease), which the debug
      # build skips; signs with the debug key when no key.properties exists.
      - name: Build Android release
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}

      # Flutter will stop building plugins that apply the Kotlin Gradle
      # Plugin. TODO(US-151–154): drop continue-on-error once the plugin
      # upgrades are done (US-158).
      - name: No plugins applying the Kotlin Gradle Plugin
        continue-on-error: true
        run: |
          if grep -q "apply Kotlin Gradle Plugin (KGP)" build-release.log; then
            grep -A1 "apply Kotlin Gradle Plugin (KGP)" build-release.log
            exit 1
          fi

  ios:
    name: iOS debug build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed with; bump together
          # with local Flutter (unpinned 'stable' moving ahead broke CI once).
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS debug without codesigning
        run: flutter build ios --debug --no-codesign --build-number=${{ github.run_number }}
