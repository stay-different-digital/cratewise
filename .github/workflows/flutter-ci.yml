name: Flutter CI

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop

jobs:
  android:
    name: Android analyze, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The Android release build plus Gradle caches need more disk than the
      # runner has free by default; drop preinstalled tooling we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Android Gradle Plugin 9.3 (Flutter 3.50 template) runs lint with
      # Java 21 APIs; the app itself still targets Java 17.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed with; bump together
          # with local Flutter (unpinned 'stable' moving ahead broke CI once).
          flutter-version: 3.50.0
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # The release build covers everything the debug build did, plus lint
      # (lintVitalRelease); it signs with the debug key when there's no
      # key.properties. Building both ran the runner out of disk space.
      - name: Build Android release
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}

      # Flutter will stop building plugins that apply the Kotlin Gradle Plugin;
      # fail when any plugin still does (US-159).
      - name: No plugins applying the Kotlin Gradle Plugin
        run: |
          if grep -q "apply Kotlin Gradle Plugin (KGP)" build-release.log; then
            grep -A1 "apply Kotlin Gradle Plugin (KGP)" build-release.log
            exit 1
          fi

  ios:
    name: iOS debug build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed with; bump together
          # with local Flutter (unpinned 'stable' moving ahead broke CI once).
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS debug without codesigning
        run: flutter build ios --debug --no-codesign --build-number=${{ github.run_number }}
