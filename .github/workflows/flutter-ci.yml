name: Flutter CI

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop

jobs:
  android:
    name: Android analyze, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed and released with.
          # Unpinned, CI picked up 3.50 (material.dart deprecated) on
          # 2026-11-16 and failed analyze; bump together with local Flutter.
          flutter-version: 3.44.7
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug
        run: flutter build apk --debug --build-number=${{ github.run_number }}

  ios:
    name: iOS debug build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed and released with.
          # Unpinned, CI picked up 3.50 (material.dart deprecated) on
          # 2026-11-16 and failed analyze; bump together with local Flutter.
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS debug without codesigning
        run: flutter build ios --debug --no-codesign --build-number=${{ github.run_number }}
